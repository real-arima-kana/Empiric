<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b16"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>EMPIRIC</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
:root{font-family:Inter,'Helvetica Neue',Arial,sans-serif;color:#f2f4f0;background:#101b16;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100dvh}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.app{max-width:600px;margin:auto;min-height:100dvh;padding:env(safe-area-inset-top) 20px calc(100px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;padding:26px 0 20px}.brand{font-size:20px;font-weight:700;letter-spacing:.31em}.eyebrow{color:#9da8a0;letter-spacing:.2em;font-size:10px;font-weight:700;text-transform:uppercase}.muted{color:#9da8a0}.panel{background:#1b211d;border:1px solid #303a33;border-radius:16px;padding:18px;margin:12px 0}.pyramid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:330px;overflow:hidden;padding:18px 0}.pyr-row{display:flex;gap:3px}.block{border:0;padding:0;width:var(--block);height:var(--block);border-radius:2px;background:#48534c;flex:none}.block.yes{background:#49b77b}.block.no{background:#c75a55}.block.pending{background:#5a655e}.block:focus-visible{outline:2px solid white;outline-offset:1px}.star{font-size:36px;color:#f0c55d;text-shadow:0 0 18px #f0c55d66;line-height:1}.hero{text-align:center;padding-top:12px}.hero h1{font-size:32px;letter-spacing:.03em;margin:6px 0}.hero p{font-size:13px;color:#9da8a0;margin:0}.primary{background:#e4efe6;color:#101b16;border:0;border-radius:11px;padding:14px 18px;font-weight:750;width:100%}.secondary{background:#29332c;color:#edf4ed;border:1px solid #465449;border-radius:11px;padding:12px 16px}.danger{background:#4c2727;color:#ffe7e7;border:1px solid #874a4a;border-radius:11px;padding:12px 16px}.actions{display:flex;gap:10px}.actions>*{flex:1}.nav{position:fixed;bottom:0;left:0;right:0;background:#151a16f5;border-top:1px solid #304738;display:flex;justify-content:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom));z-index:5}.nav-inner{width:min(600px,100%);display:grid;grid-template-columns:repeat(4,1fr)}.nav button{border:0;background:transparent;color:#929e95;padding:9px 3px;font-size:11px}.nav button.active{color:#f1f7f2}.nav .symbol{display:block;font-size:21px;margin-bottom:4px}h2{font-size:24px;margin:16px 0}h3{font-size:16px;margin:0 0 8px}.habit{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #304738}.habit:last-child{border-bottom:0}.habit-name{font-size:15px;overflow-wrap:anywhere}.habit small{display:block;color:#95a197;margin-top:4px}.answer{display:flex;gap:7px}.answer button{width:47px;height:42px;border-radius:9px;border:1px solid #465149;background:#29322b;color:#f4f4f4;font-weight:700}.answer button.yes.selected{background:#49b77b;color:#102016}.answer button.no.selected{background:#c75a55;color:#fff}.field{background:#121713;border:1px solid #526056;color:white;width:100%;padding:15px;border-radius:10px;margin:10px 0 14px}.note{font-size:13px;color:#9da8a0;line-height:1.55}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:20px}.stat{background:#1b211d;border-radius:12px;padding:14px 6px;text-align:center}.stat strong{display:block;font-size:22px}.stat span{font-size:10px;color:#9da8a0}.section-heading{display:flex;justify-content:space-between;align-items:center}.pill{font-size:11px;background:#29372e;border:1px solid #455749;border-radius:99px;padding:6px 10px;color:#bfe7c9}.empty{padding:28px 0;text-align:center;color:#9da8a0}.history-item{border-bottom:1px solid #364039;padding:14px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.history-item:last-child{border:0}.swatch{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:4px}.modal-wrap{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modal{background:#1d241f;border:1px solid #49554c;border-radius:18px;padding:22px;width:min(420px,100%)}.modal h3{font-size:20px}.hidden{display:none!important}label.toggle{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:12px 0}input[type=checkbox]{accent-color:#49b77b;width:20px;height:20px}.footer{font-size:11px;text-align:center;color:#69756c;margin-top:28px}.tiny{font-size:12px}.link-btn{background:none;border:0;color:#b5d9be;text-decoration:underline;padding:6px}#toast{position:fixed;bottom:94px;left:50%;transform:translateX(-50%);background:#e4efe6;color:#172018;padding:10px 16px;border-radius:10px;z-index:20;font-size:13px;white-space:nowrap}.progress{height:5px;background:#304738;border-radius:99px;overflow:hidden;margin:12px 0}.progress>div{height:100%;background:#49b77b}

/* EMPIRIC V1.1 · understated, tactile motion */
@keyframes enter{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
@keyframes bloom{from{opacity:0;transform:scale(.76)}to{opacity:1;transform:scale(1)}}
@keyframes glint{0%,100%{filter:drop-shadow(0 0 5px #f0c55d55)}50%{filter:drop-shadow(0 0 14px #f0c55daa)}}
.hero,.panel,.stats,.pyramid{animation:enter .4s ease both}
.pyr-row{animation:enter .34s ease both;animation-delay:calc(var(--row,0)*19ms)}
.block{transition:background .22s ease,transform .18s ease,box-shadow .24s ease;animation:bloom .28s ease both}
.block:active{transform:scale(.83)}
.block.yes{box-shadow:0 0 9px #49b77b20}.block.no{box-shadow:0 0 9px #c75a5520}
.primary,.secondary,.danger,.answer button,.nav button{transition:background .2s ease,transform .16s ease,opacity .2s ease,border-color .2s ease}
.primary:active,.secondary:active,.danger:active,.answer button:active,.nav button:active{transform:scale(.96)}
.modal{animation:bloom .22s ease both}.modal-wrap{animation:enter .16s ease both}
.star{animation:glint 3s ease-in-out infinite}
.field:focus{outline:2px solid #6fae86;outline-offset:1px;border-color:#6fae86}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
